openapi: "3.1.0"
info:
  title: "Auto Repair Shop Execution API"
  description: |
    API do execution service - FIAP SOAT.

    Responsável pela fila de execução das ordens de serviço, pelo avanço de
    status durante diagnóstico e reparo, e pelo estoque de peças. Participa da
    coreografia por eventos: enfileira a OS ao receber `OrderCreated`, reserva o
    estoque no diagnóstico, libera a reserva nas compensações (`QuoteRejected`,
    `PaymentFailed`) e comunica o fim da execução ao order.

    Persistência em DynamoDB single-table.
  version: "1.0.0"

servers:
  - url: "http://localhost:8080"
    description: "Local development server"

tags:
  - name: Health
    description: "Health check da aplicação"
  - name: Order
    description: "Ordem de serviço na oficina: fila, diagnóstico e ciclo de execução (requer role MECHANIC)"
  - name: Service
    description: "Catálogo de serviços da oficina (ADMIN, ATTENDANT ou MECHANIC)"
  - name: Supply
    description: "Gerenciamento do estoque de peças (ADMIN, ATTENDANT ou MECHANIC)"

paths:
  /health:
    get:
      tags:
        - Health
      summary: "Health check"
      description: "Verifica se a aplicação está no ar. Usado pelas probes do Kubernetes."
      responses:
        "200":
          description: "Aplicação saudável"
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - "OK"

  /metrics:
    get:
      tags:
        - Health
      summary: "Métricas Prometheus"
      description: "Métricas no formato Prometheus, coletadas pelo ServiceMonitor."
      responses:
        "200":
          description: "Métricas expostas"
          content:
            text/plain:
              schema:
                type: string

  /v1/orders:
    get:
      tags:
        - Order
      summary: "Lista ordens de serviço por status"
      description: |
        Fila de trabalho do mecânico. Sem o parâmetro `status`, retorna as ordens em
        `AWAITING_DIAGNOSIS`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: "Status a filtrar. Default: `AWAITING_DIAGNOSIS`."
          schema:
            $ref: "#/components/schemas/ExecutionStatus"
      responses:
        "200":
          description: "Lista de ordens no status informado"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExecutionResponse"
        "400":
          description: "Status informado não é um valor válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente, inválido ou sem o claim `cpf`"
        "403":
          description: "Token válido, mas sem a role MECHANIC"

  /v1/orders/{orderId}:
    get:
      tags:
        - Order
      summary: "Consulta uma ordem de serviço"
      description: "Retorna a visão de oficina da ordem de serviço informada."
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: "Identificador da ordem de serviço"
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Ordem encontrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResponse"
        "400":
          description: "`orderId` não é um UUID válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente, inválido ou sem o claim `cpf`"
        "403":
          description: "Token válido, mas sem a role MECHANIC"
        "404":
          description: "Nenhuma ordem de serviço com o id informado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/orders/{orderId}/finish-diagnosis:
    post:
      tags:
        - Order
      summary: "Conclui o diagnóstico"
      description: |
        O mecânico informa os serviços e insumos que a OS precisa. O execution resolve os
        preços no catálogo e no estoque, reserva o estoque de forma atômica, move a ordem
        para `RESERVED` e publica `DiagnoseFinished`. O `diagnosedBy` sai do JWT
        (`sub` + `cpf`).

        Se faltar insumo, responde `409` com o que faltou, move a ordem para `CANCELED` e
        publica `SuppliesUnavailable`.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishDiagnosisRequest"
      responses:
        "200":
          description: "Diagnóstico concluído e estoque reservado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResponse"
        "400":
          description: "`orderId` inválido ou corpo da requisição malformado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente, inválido ou sem o claim `cpf`"
        "403":
          description: "Token válido, mas sem a role MECHANIC"
        "404":
          description: "Ordem de serviço ou serviço do catálogo inexistente"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Estoque insuficiente, ou a ordem não está mais aguardando diagnóstico"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuppliesUnavailableResponse"

  /v1/orders/{orderId}/start:
    post:
      tags:
        - Order
      summary: "Inicia a execução"
      description: |
        O mecânico retira a ordem da fila `ENQUEUED` e começa o reparo. Move para
        `IN_PROGRESS` e publica `ExecutionStarted`.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Execução iniciada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResponse"
        "400":
          description: "`orderId` não é um UUID válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente, inválido ou sem o claim `cpf`"
        "403":
          description: "Token válido, mas sem a role MECHANIC"
        "404":
          description: "Nenhuma ordem de serviço com o id informado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Ordem em estado que não permite iniciar"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/orders/{orderId}/finish:
    post:
      tags:
        - Order
      summary: "Conclui a execução"
      description: |
        Marca a execução como concluída e move para `COMPLETED`. Publica
        `ExecutionFinished`, que leva o order a fechar a OS.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Execução concluída"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResponse"
        "400":
          description: "`orderId` não é um UUID válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente, inválido ou sem o claim `cpf`"
        "403":
          description: "Token válido, mas sem a role MECHANIC"
        "404":
          description: "Nenhuma ordem de serviço com o id informado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Ordem em estado que não permite conclusão"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/orders/{orderId}/fail:
    post:
      tags:
        - Order
      summary: "Registra falha na execução"
      description: |
        Marca a execução como falha, com o motivo informado, e move para `FAILED`.
        Publica `ExecutionFailed`, que dispara a compensação no fluxo distribuído.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: "Motivo da falha"
                  examples:
                    - "Peça chegou com defeito de fábrica"
              required:
                - reason
      responses:
        "200":
          description: "Falha registrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResponse"
        "400":
          description: "`orderId` inválido ou corpo da requisição malformado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente, inválido ou sem o claim `cpf`"
        "403":
          description: "Token válido, mas sem a role MECHANIC"
        "404":
          description: "Nenhuma ordem de serviço com o id informado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Ordem em estado que não permite registrar falha"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/services:
    get:
      tags:
        - Service
      summary: "Lista os serviços do catálogo"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Lista de serviços"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceResponse"
        "401":
          description: "Token ausente, inválido ou sem o claim `cpf`"
        "403":
          description: "Role não autorizada"

    post:
      tags:
        - Service
      summary: "Cadastra um serviço"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: "Serviço cadastrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "400":
          description: "Corpo da requisição inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente, inválido ou sem o claim `cpf`"
        "403":
          description: "Role não autorizada"

  /v1/services/{id}:
    get:
      tags:
        - Service
      summary: "Consulta um serviço"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Serviço encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "400":
          description: "`id` não é um UUID válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente, inválido ou sem o claim `cpf`"
        "403":
          description: "Role não autorizada"
        "404":
          description: "Serviço não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Service
      summary: "Atualiza um serviço"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "200":
          description: "Serviço atualizado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "400":
          description: "`id` inválido ou corpo da requisição malformado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente, inválido ou sem o claim `cpf`"
        "403":
          description: "Role não autorizada"
        "404":
          description: "Serviço não encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Service
      summary: "Remove um serviço"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Serviço removido"
        "400":
          description: "`id` não é um UUID válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente, inválido ou sem o claim `cpf`"
        "403":
          description: "Role não autorizada"

  /v1/supplies:
    get:
      tags:
        - Supply
      summary: "Lista as peças em estoque"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Lista de peças"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplyResponse"
        "401":
          description: "Token ausente ou inválido"
        "403":
          description: "Role não autorizada"

    post:
      tags:
        - Supply
      summary: "Cadastra uma peça"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplyRequest"
      responses:
        "201":
          description: "Peça cadastrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyResponse"
        "400":
          description: "Corpo da requisição inválido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente ou inválido"
        "403":
          description: "Role não autorizada"

  /v1/supplies/{id}:
    get:
      tags:
        - Supply
      summary: "Consulta uma peça"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Peça encontrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyResponse"
        "400":
          description: "`id` não é um UUID válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente ou inválido"
        "403":
          description: "Role não autorizada"
        "422":
          description: "Peça não encontrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Supply
      summary: "Atualiza uma peça"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplyRequest"
      responses:
        "200":
          description: "Peça atualizada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyResponse"
        "400":
          description: "`id` inválido ou corpo da requisição malformado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente ou inválido"
        "403":
          description: "Role não autorizada"
        "422":
          description: "Peça não encontrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Supply
      summary: "Remove uma peça"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Peça removida"
        "400":
          description: "`id` não é um UUID válido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: "Token ausente ou inválido"
        "403":
          description: "Role não autorizada"
        "422":
          description: "Peça não encontrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Autenticação via JWT Bearer Token.

        O token é emitido pelo Lambda Authorizer no API Gateway (repositório
        separado). O app decodifica as claims (`sub` → userId, `role`) sem
        re-validar a assinatura.

        **Formato do header:**
        `Authorization: Bearer <token>`

        Rotas de `/v1/orders` exigem a role `MECHANIC`; as de `/v1/services` e
        `/v1/supplies` aceitam `ADMIN`, `ATTENDANT` ou `MECHANIC`. O token precisa
        carregar `sub`, `role` e `cpf`.

  schemas:
    ExecutionStatus:
      type: string
      description: "Status da ordem de serviço dentro da oficina"
      enum:
        - AWAITING_DIAGNOSIS
        - RESERVED
        - ENQUEUED
        - IN_PROGRESS
        - COMPLETED
        - FAILED
        - CANCELED

    ExecutionResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
          description: "Ordem de serviço à qual a execução pertence"
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        reservationId:
          type: [string, "null"]
          format: uuid
          description: "Reserva de peças associada, quando houver"
        diagnosedBy:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: "Mecânico que concluiu o diagnóstico, quando houver"
        paymentId:
          type: [string, "null"]
          description: "Identificador do pagamento confirmado, quando houver"
        createdAt:
          type: string
          description: "Data de criação"
        modifiedAt:
          type: string
          description: "Data da última modificação"
      required:
        - orderId
        - status
        - createdAt
        - modifiedAt

    User:
      type: object
      description: "Identidade extraída do JWT (`sub` + `cpf`)"
      properties:
        id:
          type: string
          format: uuid
        document:
          type: string
          examples:
            - "12345678909"
      required:
        - id
        - document

    FinishDiagnosisRequest:
      type: object
      description: "Serviços e insumos determinados pelo mecânico no diagnóstico"
      properties:
        services:
          type: array
          default: []
          items:
            type: string
            format: uuid
        supplies:
          type: array
          default: []
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              quantity:
                type: integer
            required:
              - id
              - quantity

    SuppliesUnavailableResponse:
      type: object
      description: "Insumos sem estoque suficiente para o diagnóstico solicitado"
      properties:
        code:
          type: string
          examples:
            - "SUPPLIES_UNAVAILABLE"
        message:
          type: string
        missingSupplies:
          type: array
          items:
            type: object
            properties:
              supplyId:
                type: string
                format: uuid
              name:
                type: string
              requested:
                type: integer
              available:
                type: integer
            required:
              - supplyId
              - name
              - requested
              - available
      required:
        - code
        - message
        - missingSupplies

    CreateServiceRequest:
      type: object
      properties:
        name:
          type: string
          examples:
            - "Troca de óleo"
        description:
          type: [string, "null"]
          examples:
            - "Óleo e filtro"
        price:
          type: number
          examples:
            - 100.00
        requiredSupplies:
          type: array
          items:
            $ref: "#/components/schemas/SupplyRequirement"
      required:
        - name
        - price

    ServiceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        price:
          type: number
        requiredSupplies:
          type: array
          items:
            $ref: "#/components/schemas/SupplyRequirement"
      required:
        - id
        - name
        - price
        - requiredSupplies

    SupplyRequirement:
      type: object
      properties:
        supplyId:
          type: string
          format: uuid
        quantity:
          type: integer
      required:
        - supplyId
        - quantity

    CreateSupplyRequest:
      type: object
      properties:
        name:
          type: string
          examples:
            - "Pastilha de freio dianteira"
        description:
          type: [string, "null"]
          examples:
            - "Compatível com modelos 2015-2020"
        quantityInStock:
          type: integer
          examples:
            - 24
        price:
          type: number
          examples:
            - 189.90
      required:
        - name
        - quantityInStock
        - price

    SupplyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        quantityInStock:
          type: integer
        price:
          type: number
      required:
        - id
        - name
        - quantityInStock
        - price

    ErrorResponse:
      type: object
      description: "Formato padrão de erro da aplicação"
      properties:
        code:
          type: string
          examples:
            - "EXECUTION_NOT_FOUND"
        message:
          type: string
          examples:
            - "Execution not found"
      required:
        - code
        - message

    ValidationError:
      type: object
      description: "Erro de validação de entrada, com detalhamento por campo"
      properties:
        code:
          type: string
          examples:
            - "BAD_REQUEST"
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
              - field
              - message
      required:
        - code
        - fieldErrors
